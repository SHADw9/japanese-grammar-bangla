name: Build Android APK

on:
  push:
    tags: ["v*"]          # e.g. git tag v1.0.0 && git push origin v1.0.0
  workflow_dispatch:       # or run it manually from the Actions tab

permissions:
  contents: write          # needed to create the GitHub Release

jobs:
  apk:
    runs-on: ubuntu-latest
    env:
      KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install dependencies
        run: npm install

      - name: Work out version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then V="${GITHUB_REF_NAME#v}"; else V="0.0.${GITHUB_RUN_NUMBER}"; fi
          echo "APP_VERSION=$V" >> "$GITHUB_ENV"

      - name: Build web files
        run: npm run build:www

      - name: Create Android project
        run: npx cap add android

      - name: Patch manifest and version
        run: APP_VERSION_CODE="$GITHUB_RUN_NUMBER" node scripts/patch-android.mjs

      - name: Sync web files and plugins
        run: npx cap sync android

      - name: Build signed release APK
        if: ${{ env.KEYSTORE_B64 != '' }}
        run: |
          cd android && chmod +x gradlew && ./gradlew assembleRelease --no-daemon
          cd ..
          mkdir -p dist
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          "$BT/zipalign" -p -f 4 android/app/build/outputs/apk/release/app-release-unsigned.apk aligned.apk
          echo "$KEYSTORE_B64" | base64 -d > release.jks
          "$BT/apksigner" sign --ks release.jks --ks-pass env:KS_PASS \
            --ks-key-alias "$KEY_ALIAS" --key-pass env:KEY_PASS \
            --out "dist/japanese-grammar-bangla-v${APP_VERSION}.apk" aligned.apk
          rm -f release.jks

      - name: Build debug APK (no signing key set)
        if: ${{ env.KEYSTORE_B64 == '' }}
        run: |
          cd android && chmod +x gradlew && ./gradlew assembleDebug --no-daemon
          cd ..
          mkdir -p dist
          cp android/app/build/outputs/apk/debug/app-debug.apk "dist/japanese-grammar-bangla-v${APP_VERSION}-debug.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: apk
          path: dist/*.apk

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.apk
          generate_release_notes: true
