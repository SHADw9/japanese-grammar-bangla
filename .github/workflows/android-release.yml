name: Build Android APK

on:
  push:
    branches: [main]
    paths-ignore: ["**.md"]   # docs-only pushes don't need a new APK
  workflow_dispatch:           # or run it manually from the Actions tab

# One build at a time, so version numbers and releases stay in order.
concurrency:
  group: android-release
  cancel-in-progress: false

permissions:
  contents: write              # needed to create the tag + GitHub Release

jobs:
  apk:
    runs-on: ubuntu-latest
    env:
      KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install dependencies
        run: npm install

      # major.minor comes from package.json, patch is the CI run number,
      # so every build is a higher version than the last — no manual tagging.
      - name: Work out version
        run: |
          BASE=$(node -p "require('./package.json').version.split('.').slice(0,2).join('.')")
          V="$BASE.$GITHUB_RUN_NUMBER"
          echo "APP_VERSION=$V" >> "$GITHUB_ENV"
          echo "Building v$V"

      - name: Build web files
        run: npm run build:www

      - name: Create Android project
        run: npx cap add android

      - name: Apply launcher icons
        run: node scripts/apply-android-icons.mjs

      - name: Patch manifest and version
        run: APP_VERSION_CODE="$GITHUB_RUN_NUMBER" node scripts/patch-android.mjs

      - name: Sync web files and plugins
        run: npx cap sync android

      - name: Build signed release APK
        if: ${{ env.KEYSTORE_B64 != '' }}
        run: |
          cd android && chmod +x gradlew && ./gradlew assembleRelease --no-daemon
          cd ..
          mkdir -p dist
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          "$BT/zipalign" -p -f 4 android/app/build/outputs/apk/release/app-release-unsigned.apk aligned.apk
          echo "$KEYSTORE_B64" | base64 -d > release.jks
          "$BT/apksigner" sign --ks release.jks --ks-pass env:KS_PASS \
            --ks-key-alias "$KEY_ALIAS" --key-pass env:KEY_PASS \
            --out "dist/japanese-grammar-bangla-v${APP_VERSION}.apk" aligned.apk
          rm -f release.jks

      - name: Build debug APK (no signing key set)
        if: ${{ env.KEYSTORE_B64 == '' }}
        run: |
          cd android && chmod +x gradlew && ./gradlew assembleDebug --no-daemon
          cd ..
          mkdir -p dist
          cp android/app/build/outputs/apk/debug/app-debug.apk "dist/japanese-grammar-bangla-v${APP_VERSION}-debug.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: apk
          path: dist/*.apk

      # Creates the tag and the Release automatically on every build.
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.APP_VERSION }}
          name: v${{ env.APP_VERSION }}
          files: dist/*.apk
          generate_release_notes: true
          fail_on_unmatched_files: true
